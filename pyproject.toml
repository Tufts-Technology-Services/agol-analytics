[project]
name = "agol-analytics"
version = "0.2.0"
description = "collect ArcGIS Online usage metrics"
authors = [
    {name="uuusta01", email="uku-kaspar.uustalu@tufts.edu"}, 
    {name="cbarne02", email="christopher.barnett@tufts.edu"}
    ]
dependencies = [
    "pandas>=2.1.2",
    "requests>=2.30.0",
    "database-interface",
    "analytics-utils",
    ]
requires-python = "~=3.11"

# not on PyPI. Projects that depend on agol-analytics declare their own sources for these
# (see rt-analytics-airflow); pip users install them from requirements.txt.
[tool.uv.sources]
database-interface = { git = "https://github.com/Tufts-Technology-Services/analytics-database-interface.git" }
analytics-utils = { git = "ssh://git@github.com/Tufts-Technology-Services/analytics-utils.git" }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ensure_table() runs agol_analytics/sql/create_agol_logins.sql from the installed package
[tool.setuptools.package-data]
agol_analytics = ["sql/*.sql"]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "agol-analytics"
version = "0.1.13"
description = "collect ArcGIS Online usage metrics"
authors = [
    {name="uuusta01", email="uku-kaspar.uustalu@tufts.edu"}, 
    {name="cbarne02", email="christopher.barnett@tufts.edu"}
    ]
dependencies = [
    "arcgis==2.3.0.3",
    "pandas<2.2.0,>=2.0.0",
    "requests<2.32.0,>=2.30.0",
    "database-interface @ git+ssh://git@github.com/Tufts-Technology-Services/analytics-database-interface.git",
    "analytics-utils @ git+ssh://git@github.com/Tufts-Technology-Services/analytics-utils.git",
    ]
requires-python = "~=3.11"

[tool.hatch.metadata] 
allow-direct-references = true

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"
